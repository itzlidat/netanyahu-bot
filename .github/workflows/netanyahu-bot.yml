name: Netanyahu Alert Bot

on:
  schedule:
    # Runs every 15 minutes. Adjust the cron as you like.
    - cron: '*/15 * * * *'
  workflow_dispatch: {}  # lets you manually trigger a run from the Actions tab

permissions:
  contents: write  # needed so the bot can commit seen.json back to the repo

jobs:
  check-and-alert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install feedparser requests

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python netanyahu_bot.py

      - name: Commit updated seen.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen.json
          git diff --staged --quiet || git commit -m "Update seen articles"
          git push